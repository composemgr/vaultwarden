# nginx proxy address - http://172.17.0.1:64382

name: vaultwarden
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: vaultwarden/server:latest
    container_name: vaultwarden-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: vaultwarden-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DOMAIN: https://${BASE_HOST_NAME:-$HOSTNAME}
      SIGNUPS_ALLOWED: true
      SIGNUPS_VERIFY: true
      SENDS_ALLOWED: true
      SHOW_PASSWORD_HINT: true
      INVITATIONS_ALLOWED: true
      ORG_GROUPS_ENABLED: true
      ORG_CREATION_USERS: all
      TRASH_AUTO_DELETE_DAYS: 30
      ADMIN_TOKEN: ${APP_SECRET_KEY:-replace-with-a-random-16-byte-hex-string}
      SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      SMTP_FROM: ${EMAIL_SERVER_MAIL_FROM:-no-reply@${BASE_HOST_NAME:-$HOSTNAME}}
      SMTP_FROM_NAME: ${APP_ORG_NAME:-Vaultwarden}
      SMTP_SECURITY: starttls
      SMTP_EMBED_IMAGES: true
    ports:
      - '172.17.0.1:64382:80'
    volumes:
      - './volumes/data/vaultwarden:/data:z'
    networks:
      - vaultwarden

networks:
  vaultwarden:
    name: vaultwarden
    external: false
